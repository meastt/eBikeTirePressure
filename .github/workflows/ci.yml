name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          SITE_URL: https://ebike-psi.com

      - name: Check build output
        run: |
          echo "Checking that build created static pages..."
          ls -la .next/server/app/
          test -d .next/server/app/models
